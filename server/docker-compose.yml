services:
  db:
    restart: always
    privileged: true
    image: mysql:8.0
    container_name: mysql
    volumes:
      - ./init/init.sql:docker-entrypoint-initdb.d/init.sql
      - ./db:/var/lib/mysql
      - ./logs/mysql:/logs
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
    environment:
      MYSQL_ROOT_PASSWORD: "Abc*(12345)67890"
      MYSQL_USER: "sinomed"
      MYSQL_PASSWORD: "Abc$*(12345)67890"
      MYSQL_INITDB_SKIP_TZINFO: "Asia/Shanghai"
    ports:
        - 3306:3306
  server:
    container_name: server
    image: cuihairu/sinomed:v0.1.0
    ports:
      - 2347:2347
    depends_on:
      - db
    # 与 db 同处 compose 默认网络，故按服务名 db 解析；DB_HOST/DB_PORT/DB_NAME 无默认值，必须显式注入（SERVER_PORT 已有默认 2347，此处显式写明）
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: sinomed
      DB_USERNAME: sinomed
      DB_PASSWORD: "Abc$*(12345)67890"
      SERVER_PORT: "2347"
  web:
    container_name: web 
    image: nginx
    restart: always
    depends_on:
      - server
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./init/nginx_http.conf:/etc/nginx/sites-enabled/default
      - ./web/dist:/usr/share/nginx/html
