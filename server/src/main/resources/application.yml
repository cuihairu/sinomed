spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    # 默认 MySQL；演示环境可整串换 SQLite（见根目录 compose.yml），如：
    #   DB_URL=jdbc:sqlite:/app/data/sinomed.db?journal_mode=WAL&busy_timeout=5000
    #   DB_DRIVER=org.sqlite.JDBC DB_DIALECT=org.hibernate.community.dialect.SQLiteDialect
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    dbcp2:
      test-on-borrow: true
      validation-query: SELECT 1
      test-while-idle: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        useUnicode: true
        characterEncoding: UTF-8
        dialect: ${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
        show_sql: true
    open-in-view: false
  security:
    user:
      name: admin
      password: admin
      roles: ADMIN

# 广告投屏：媒体落盘目录与对外前缀（Nginx /media/ 托管同目录，见 WebMvcConfig）
sinomed:
  ads:
    upload-dir: ${ADS_UPLOAD_DIR:data/ads}
    url-prefix: /media
  # 打印模板：覆盖目录（放同名 .html 覆盖内置版式，桌面壳经 /api/v1/print/templates 拉取，见 desktop.md D7）
  print:
    templates-dir: ${PRINT_TEMPLATES_DIR:data/printtemplates}

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # a day
      refresh-token:
        expiration: 604800000 # 7 days


# 演示种子数据开关：DEMO_SEED=true 时启动播种（虚构脱敏数据，逐表幂等，已有数据跳过）
demo:
  seed: ${DEMO_SEED:false}

server:
  # 端口：部署时可用 SERVER_PORT 覆盖（compose.yml 已注入），本地裸跑默认 2347
  port: ${SERVER_PORT:2347}
  servlet:
    session:
      timeout: 24h

springdoc:
  swagger-ui:
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: true
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.sinomed.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
    level:
      org.hibernate.SQL: debug
      org.hibernate.type: trace
      org.springframework.security: debug