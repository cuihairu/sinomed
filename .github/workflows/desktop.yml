# 构建桌面工作站安装包（Tauri 2 薄壳，desktop.md D4）。
# 触发：main 分支 push 且 desktop/ 或本文件变更；也可手动触发。
# Windows 产 NSIS 安装包，Linux 产 deb；产物作为 artifact 供下载。
# 更新发布（nightly Release + latest.json 签名清单）是独立的手动点火 job，不在 push 链上自动发版。
name: Desktop Build

on:
  push:
    branches: [ "main" ]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-nsis
            os: windows-2022
            args: build --bundles nsis
          - name: linux-deb
            os: ubuntu-24.04
            args: build --bundles deb
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - uses: dtolnay/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux build deps (Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf libudev-dev
          # libudev-dev：serialport crate 的 Linux 后端依赖（扫码枪串口 D8/D9 起）
      - name: Build (${{ matrix.name }})
        run: pnpm tauri ${{ matrix.args }}
        working-directory: desktop
        # conf 里已开 createUpdaterArtifacts（updater 签名公钥），构建期即需私钥签名更新包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sinomed-desktop-windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sinomed-desktop-linux-deb
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Rust 单元测试门禁：src-tauri 内的 #[test]（ESC/POS 字节流、打印模板、配置解析、
  # 扫码行切分、崩溃预算等核心逻辑）。此前只存在于源码，构建流程不跑，此 job 与构建矩阵并行拦截逻辑回归。
  # frontendDist 指向入库的 desktop/ui 静态资源，故无需前端构建即可编译。
  test:
    name: rust unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux deps (wry/serialport crate prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libudev-dev
      - name: Run cargo test
        run: cargo test
        working-directory: desktop/src-tauri

  # nightly 滚动 Release：仅手动点火（仓库口径不在 push 链上自动 tag/release）。
  # 前置：TAURI_SIGNING_PRIVATE_KEY 已存 repo secret（私钥口令为空，无需 PASSWORD secret）。
  # 产出：nightly 预发布 + NSIS 包 + .sig 签名 + latest.json（updater 清单），壳内查更新即命中该地址。
  release:
    name: nightly Release（手动点火）
    runs-on: windows-2022
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - uses: dtolnay/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop/src-tauri
      - name: Build & publish nightly
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: nightly
          releaseName: 桌面工作站 nightly 滚动预发布
          releaseBody: main 通过后的滚动预发布：NSIS 安装包与 updater 签名清单 latest.json。
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: --bundles nsis
