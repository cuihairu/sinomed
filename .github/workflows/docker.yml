# 构建并推送 Docker 镜像到 ghcr.io。
# 触发：main 分支 push 且 server/、web/ 或本文件变更；也可手动触发。
# tag 约定：latest（main 滚动最新）+ sha-<短提交>（可回溯、可回滚）。
# 首次发布后需在 GitHub Package 设置把 sinomed-server / sinomed-web 改为 Public，演示机才能匿名拉取。
name: Docker Images

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images
  cancel-in-progress: true

jobs:
  server:
    name: server 镜像
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算短提交号
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sinomed-server:latest
            ghcr.io/${{ github.repository_owner }}/sinomed-server:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  web:
    name: web 镜像
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算短提交号
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sinomed-web:latest
            ghcr.io/${{ github.repository_owner }}/sinomed-web:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
